name = "canvas-commons"
main = "src/worker.js"
compatibility_date = "2025-06-01"

# The storefront, artist desk and CMS are static files in docs/; /api/* is handled by the Worker.
[assets]
directory = "./docs"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "canvas-commons"
database_id = "REPLACE_WITH_D1_ID"
migrations_dir = "migrations"

# Artwork photos
[[kv_namespaces]]
binding = "IMAGES"
id = "REPLACE_WITH_KV_ID"
